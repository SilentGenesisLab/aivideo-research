# 参考视频检索：https://videodata.sligenai.cn → 本机 127.0.0.1:8770
# 安装：sudo bash deploy/setup-https.sh（会复制本文件并用 certbot 申请证书、配置 443 与 http→https 跳转）
server {
    listen 80;
    listen [::]:80;
    server_name videodata.sligenai.cn;

    client_max_body_size 20m;          # 产品图上传上限 15MB

    gzip on;                           # 后端已对页面/JSON 压缩，这里兜底
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;       # 中转播放、下载可能较久
        proxy_send_timeout 300s;
        proxy_buffering off;           # 视频边下边播、断点续传
    }
}
