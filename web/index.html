<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>参考视频检索</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/static/layout.css?v=3">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2129; --muted:#6b7280; --line:#e5e7eb;
          --accent:#2563eb; --accent-soft:#eff4ff; --ok:#16a34a; --bad:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --card:#1b1e24; --text:#e6e8eb; --muted:#9aa1ab; --line:#2c313a;
            --accent:#6b9bff; --accent-soft:#1f2a40; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:1180px; margin:0 auto; padding:24px 16px 80px; }
  h1 { font-size:22px; margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  .form { display:grid; grid-template-columns:220px 1fr; gap:18px; }
  @media (max-width:720px) { .form { grid-template-columns:1fr; } }
  .drop { border:2px dashed var(--line); border-radius:10px; height:220px; display:flex; align-items:center;
          justify-content:center; text-align:center; color:var(--muted); cursor:pointer; overflow:hidden; }
  .drop img { max-width:100%; max-height:100%; object-fit:contain; }
  textarea { width:100%; min-height:80px; resize:vertical; padding:10px; border-radius:8px;
             border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; }
  .opts { display:flex; flex-wrap:wrap; gap:14px 22px; margin:12px 0; align-items:center; }
  .opts label { display:flex; gap:6px; align-items:center; }
  a { color:var(--accent); }
  input[type=number], select { width:auto; padding:4px 6px; border-radius:6px; border:1px solid var(--line);
                               background:var(--bg); color:var(--text); }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:9px 18px;
           font-size:14px; cursor:pointer; } button:disabled { opacity:.5; cursor:not-allowed; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .log { font:12px/1.7 ui-monospace,Menlo,monospace; color:var(--muted); white-space:pre-wrap; margin-top:10px; }
  .profile { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:6px 18px; }
  .profile b { color:var(--muted); font-weight:500; margin-right:6px; }
  .dim h3 { margin:0 0 4px; font-size:16px; }
  .learn { background:var(--accent-soft); border-radius:8px; padding:8px 12px; margin:8px 0 12px; }
  .kw { color:var(--muted); font-size:12px; margin-bottom:10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
  .v { border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
  .thumb { position:relative; aspect-ratio:16/9; background:#000; }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .badge { position:absolute; top:8px; left:8px; background:rgba(0,0,0,.7); color:#fff; padding:1px 8px;
           border-radius:10px; font-size:12px; }
  .score { left:auto; right:8px; background:var(--accent); }
  .vb { padding:10px 12px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .vt { font-weight:600; color:var(--text); text-decoration:none; display:-webkit-box;
        -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .vt:hover { color:var(--accent); }
  .meta { color:var(--muted); font-size:12px; }
  .ref { font-size:13px; } .ref::before { content:"参考："; color:var(--accent); font-weight:600; }
  .pick { margin-top:auto; display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted); }
  .dl a { color:var(--ok); }
  table { width:100%; border-collapse:collapse; } td, th { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; } td a { color:var(--accent); word-break:break-all; }
  .bar { position:sticky; bottom:12px; display:flex; gap:10px; align-items:center; justify-content:flex-end;
         background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px;
         box-shadow:0 6px 20px rgba(0,0,0,.12); }
  .srcgrp { display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; margin:6px 0; }
  .srcgrp b { font-size:12px; color:var(--muted); font-weight:500; min-width:72px; }
  .srcgrp label { display:flex; gap:5px; align-items:center; }
  .linkbtn { background:none; border:0; color:var(--accent); padding:0; font-size:12px; cursor:pointer; }
  .hist { display:flex; flex-direction:column; gap:8px; max-height:420px; overflow-y:auto; }
  .hrow { display:grid; grid-template-columns:56px 1fr auto; gap:12px; align-items:center;
          border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  .hrow.on { border-color:var(--accent); background:var(--accent-soft); }
  .hrow img { width:56px; height:56px; object-fit:contain; background:var(--bg); border-radius:6px; }
  .hrow .t { font-weight:600; } .hrow .m { font-size:12px; color:var(--muted); }
  .hrow .acts { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .hrow button { padding:5px 10px; font-size:12px; }
  @media (max-width:600px) { .hrow { grid-template-columns:44px 1fr; } .hrow img { width:44px; height:44px; }
    .hrow .acts { grid-column:1/-1; justify-content:flex-start; } }
  .tasks { display:flex; flex-direction:column; gap:6px; max-height:300px; overflow-y:auto; }
  .task { display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center;
          border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:13px; }
  .task .st { font-size:12px; padding:1px 8px; border-radius:10px; white-space:nowrap; background:var(--accent-soft); color:var(--accent); }
  .task .st.done { background:#e8f7ee; color:var(--ok); } .task .st.error { background:#fdecec; color:var(--bad); }
  .task .st.queued { background:var(--bg); color:var(--muted); }
  .task .m { color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .task button { padding:4px 10px; font-size:12px; }
  .hidden { display:none !important; } .err { color:var(--bad); } .note { color:var(--muted); font-size:12px; }
  .pfrow { border-top:1px solid var(--line); padding:12px 0; }
  .pfrow:first-of-type { border-top:0; }
  .pfrow .h { display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline; margin-bottom:8px; }
  .pfrow .h b { font-size:15px; }
  .strip { display:grid; grid-auto-flow:column; grid-auto-columns:180px; gap:10px; overflow-x:auto; padding-bottom:6px; }
  .it { border:1px solid var(--line); border-radius:8px; overflow:hidden; cursor:pointer; text-decoration:none; color:var(--text); }
  .it .thumb { aspect-ratio:16/10; }
  .it .tt { font-size:12px; padding:6px 8px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .it:hover { border-color:var(--accent); }
</style>
</head>
<body>
<script src="/static/layout.js?v=3"></script>
<div class="wrap">
  <h1>视频检索</h1>
  <p class="sub">上传产品图 → AI 拆解关键词 → 多平台检索参考广告片 → 可选下载</p>

  <div class="card">
    <div class="form">
      <label class="drop" id="drop"><span>点击或拖入产品图<br><small>jpg / png / webp</small></span>
        <input type="file" id="file" accept="image/*" hidden></label>
      <div>
        <textarea id="brief" placeholder="（可选）补充简报：商业目标、目标人群、想要的调性、竞品……"></textarea>
        <div style="margin:10px 0 4px"><span class="note">检索渠道（<span id="srccount">0</span> 个）　</span>
          <button class="linkbtn" id="srcall">全选</button> · <button class="linkbtn" id="srcnone">全不选</button></div>
        <div id="sources"><span class="note">加载中…</span></div>
        <div class="opts">
          <label>每词取 <input type="number" id="perq" value="8" min="3" max="20"> 条</label>
          <label>时长 ≤ <input type="number" id="maxdur" value="300" min="15" max="3600"> 秒</label>
        </div>
        <div class="opts">
          <label>检索后
            <select id="dlmode">
              <option value="none">不下载（之后可勾选下载）</option>
              <option value="top">自动下载评分最高的</option>
              <option value="all">下载全部结果</option>
            </select></label>
          <label id="topwrap" class="hidden">前 <input type="number" id="dltop" value="5" min="1" max="50"> 条</label>
        </div>
        <button id="go" disabled>开始检索</button>
        <div class="log" id="log"></div>
      </div>
    </div>
  </div>

  <div class="card" id="taskcard">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="margin:0">任务队列 <span class="note" id="taskstat"></span></h3></div>
    <div class="tasks" id="tasks"><span class="note">暂无任务。提交后可以继续上传下一张图，任务在后台排队执行。</span></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="margin:0">历史检索</h3><button class="linkbtn" id="histreload">刷新</button></div>
    <div class="hist" id="hist"><span class="note">加载中…</span></div>
  </div>

  <div id="out"></div>
</div>

<div class="bar hidden" id="bar">
  <span class="note" id="selcount">已选 0 条</span>
  <button class="ghost" id="selall">全选</button>
  <button id="dlbtn" disabled>下载所选</button>
</div>

<script src="/static/player.js?v=3"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "#";
let file = null, current = null;

$("#file").onchange = e => setFile(e.target.files[0]);
$("#drop").ondragover = e => e.preventDefault();
$("#drop").ondrop = e => { e.preventDefault(); setFile(e.dataTransfer.files[0]); };
$("#dlmode").onchange = e => $("#topwrap").classList.toggle("hidden", e.target.value !== "top");
function setFile(f) {
  if (!f) return; file = f;
  $("#drop").innerHTML = `<img src="${URL.createObjectURL(f)}">`;
  $("#go").disabled = false;
}

const checkedSources = () => [...document.querySelectorAll(".pf:checked")].map(c => c.value);
function updSrcCount() { $("#srccount").textContent = checkedSources().length; }

function loadSources() { return swrJSON("/api/sources", renderSources); }
function renderSources(list) {
  const groups = {};
  list.forEach(s => (groups[s.group] = groups[s.group] || []).push(s));
  $("#sources").innerHTML = Object.entries(groups).map(([g, items]) =>
    `<div class="srcgrp"><b>${esc(g)}</b>${items.map(s =>
      `<label><input type="checkbox" class="pf" value="${esc(s.key)}" checked> ${esc(s.name)}</label>`).join("")}</div>`).join("");
  document.querySelectorAll(".pf").forEach(c => c.onchange = updSrcCount);
  updSrcCount();
}
$("#srcall").onclick = () => { document.querySelectorAll(".pf").forEach(c => c.checked = true); updSrcCount(); };
$("#srcnone").onclick = () => { document.querySelectorAll(".pf").forEach(c => c.checked = false); updSrcCount(); };

function loadHistory() { return swrJSON("/api/runs", renderHistory); }
function renderHistory(runs) {
  if (!runs.length) { $("#hist").innerHTML = `<span class="note">还没有检索记录</span>`; return; }
  $("#hist").innerHTML = runs.map(r => `
    <div class="hrow ${current && current.run_id === r.run_id ? "on" : ""}">
      <img src="${esc(r.thumb || r.image)}" alt="" loading="lazy" decoding="async">
      <div><div class="t">${esc(r.product || "未识别")}${r.brief ? ` <span class="m">· ${esc(r.brief.slice(0, 40))}</span>` : ""}</div>
        <div class="m">${esc(r.created)} · ${r.kept} 条参考片 · ${r.platforms.length} 个来源（${esc(r.platforms.join("、"))}）${r.downloads ? ` · 已下载 ${r.downloads}` : ""}</div></div>
      <div class="acts"><button class="ghost" data-view="${esc(r.run_id)}">查看</button>
        <button class="ghost" data-rerun="${esc(r.run_id)}" title="用上方勾选的渠道，以同一张产品图和简报重新检索">用当前渠道重新检索</button></div>
    </div>`).join("");
  document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => viewRun(b.dataset.view));
  document.querySelectorAll("[data-rerun]").forEach(b => b.onclick = () => rerun(b.dataset.rerun));
}
$("#histreload").onclick = loadHistory;

async function viewRun(id, scroll = true) {
  const r = await fetch(`/runs/${encodeURIComponent(id)}/result.json`, {cache: "no-store"});
  if (!r.ok) return alert("读取失败");
  render(await r.json());
  loadHistory();
  if (scroll) $("#out").scrollIntoView({behavior: "smooth"});
}

// ---------- 异步任务 ----------
// 提交只负责入队，不阻塞页面；任务队列每 2 秒刷新。follow 是“提交后还没去看别的结果”的那个任务，完成后自动展示。
let follow = null, taskTimer = null, lastDone = new Set(), tasksInit = false;
const ST = {queued: "排队中", running: "进行中", done: "已完成", error: "失败"};

async function submitTask(promise, label) {
  $("#go").disabled = true;
  $("#log").textContent = `正在提交：${label}…`;
  try {
    const r = await promise;
    if (!r.ok) throw new Error((await r.json()).detail);
    follow = (await r.json()).job_id;
    $("#log").textContent = `已加入任务队列：${label}。可以继续上传下一张图提交新任务。`;
  } catch (e) { $("#log").innerHTML = `<span class="err">提交失败：${esc(e.message)}</span>`; }
  $("#go").disabled = !file;
  refreshTasks();
}

async function refreshTasks() {
  clearTimeout(taskTimer);
  let list = [];
  try { list = await (await fetch("/api/tasks", {cache: "no-store"})).json(); } catch (e) {}
  const active = list.filter(t => t.status === "queued" || t.status === "running");
  $("#taskstat").textContent = active.length ? `· ${active.length} 个进行中/排队中` : "";
  $("#tasks").innerHTML = list.length ? list.slice(0, 30).map(t => `
    <div class="task"><span class="st ${t.status}">${ST[t.status] || t.status}${t.status === "queued" && t.ahead ? `（前面 ${t.ahead} 个）` : ""}</span>
      <div style="min-width:0"><div>${t.kind === "download" ? "⬇ " : ""}${esc(t.title)} <span class="m">· ${esc(t.created.slice(5, 16))}</span></div>
        <div class="m" title="${esc(t.error || t.last)}">${esc(t.status === "error" ? t.error : t.last || (t.status === "queued" ? "等待空闲…" : ""))}</div></div>
      <div>${t.run_id && t.status === "done" ? `<button class="ghost" data-view="${esc(t.run_id)}">查看结果</button>` : ""}</div></div>`).join("")
    : `<span class="note">暂无任务。提交后可以继续上传下一张图，任务在后台排队执行。</span>`;
  $("#tasks").querySelectorAll("[data-view]").forEach(b => b.onclick = () => viewRun(b.dataset.view));

  // 新完成的任务：刷新历史；正在跟踪的自动展示
  const done = list.filter(t => t.status === "done" || t.status === "error");
  const fresh = done.filter(t => !lastDone.has(t.id));
  if (tasksInit) {
    if (fresh.some(t => t.kind === "search")) loadHistory();
    for (const t of fresh) {
      if (t.id === follow) {
        follow = null;
        if (t.status === "error") $("#log").innerHTML = `<span class="err">任务失败：${esc(t.title)}：${esc(t.error)}</span>`;
        else if (t.kind === "search" || (current && current.run_id === t.run_id)) {
          $("#log").textContent = `已完成：${t.title}`;
          await viewRun(t.run_id, t.kind === "search");
        }
      } else if (t.kind === "download" && t.status === "done" && current && current.run_id === t.run_id) {
        await viewRun(t.run_id, false);
      }
    }
  }
  done.forEach(t => lastDone.add(t.id));
  tasksInit = true;
  if (follow) {
    const ft = list.find(t => t.id === follow);
    if (ft && ft.last) $("#log").textContent = `${ft.title}：${ft.status === "queued" ? "排队中" : ft.last}`;
  }
  taskTimer = setTimeout(refreshTasks, active.length ? 2000 : 15000);
}

function rerun(id) {
  const pfs = checkedSources();
  if (!pfs.length) return alert("请至少勾选一个检索渠道");
  submitTask(fetch("/api/rerun", {method: "POST", headers: {"Content-Type": "application/json"},
                                  body: JSON.stringify({run_id: id, platforms: pfs})}), "重新检索");
}

$("#go").onclick = () => {
  const pfs = checkedSources();
  if (!pfs.length) return alert("请至少勾选一个检索渠道");
  const fd = new FormData();
  fd.append("image", file); fd.append("brief", $("#brief").value);
  fd.append("platforms", pfs.join(","));
  fd.append("per_query", $("#perq").value); fd.append("max_duration", $("#maxdur").value);
  fd.append("download_mode", $("#dlmode").value); fd.append("download_top", $("#dltop").value);
  submitTask(fetch("/api/search", {method: "POST", body: fd}), $("#brief").value.trim().slice(0, 20) || file.name);
};

const fmtDur = s => s ? `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}` : "-";
const fmtViews = n => n == null ? "-" : n >= 1e4 ? (n/1e4).toFixed(1) + "万" : n;

function render(res) {
  current = res;
  const p = res.analysis.product, s = res.stats;
  const dl = Object.fromEntries((res.downloads || []).map(d => [d.url, d]));
  let h = `<div class="card"><h3 style="margin-top:0">产品画像 <span class="note">· ${esc(res.created || "")}${res.brief ? " · " + esc(res.brief) : ""}</span></h3><div class="profile">
    <div><b>品牌</b>${esc(p.brand)}</div><div><b>产品</b>${esc(p.name)}</div>
    <div><b>品类</b>${esc(p.category)}</div><div><b>调性</b>${esc(p.tone)}</div>
    <div><b>人群</b>${esc(p.target_audience)}</div><div><b>竞品</b>${esc((p.competitors||[]).join("、"))}</div>
    <div style="grid-column:1/-1"><b>卖点</b>${esc((p.selling_points||[]).join("、"))}</div></div>
    <p class="note">检索 ${s.queries} 次 · 原始 ${s.raw} 条 · 保留 ${s.kept} 条 · ${s.seconds}s ·
    来源分布：${esc(Object.entries(res.groups.flatMap(g => g.videos).reduce((m, v) => (m[v.platform] = (m[v.platform] || 0) + 1, m), {})).map(([k, n]) => k + " " + n).join("、"))} ·
    <a href="/runs/${esc(res.run_id)}/report.md" target="_blank">Markdown 报告</a> ·
    参考点由 AI 依据标题推断，请看片核实</p></div>`;
  for (const g of res.groups) {
    h += `<div class="card dim"><h3>${esc(g.name)}</h3>
      <div class="learn"><b>参考什么：</b>${esc(g.what_to_learn)}</div>
      <div class="kw">关键词：${esc([...g.queries_zh, ...g.queries_en].join(" / "))}</div>`;
    if (!g.videos.length) h += `<p class="note">未找到达标结果，可调整关键词或去下方参考平台手动搜索。</p>`;
    h += `<div class="grid">`;
    for (const v of g.videos) {
      const d = dl[v.url];
      const local = d && d.ok ? `/runs/${res.run_id}/${encodeURI(d.file)}` : "";
      const pa = playAttrs(v.url, v.title, v.platform, local);
      h += `<div class="v"><a class="thumb" href="${esc(safeUrl(v.url))}" target="_blank" rel="noopener" ${pa}>
          <img src="${esc(thumbUrl(v.thumbnail, 480))}" loading="lazy" decoding="async" alt=""><span class="play">▶</span>
          <span class="badge">${esc(v.platform)} · ${fmtDur(v.duration)}</span>
          <span class="badge score">${esc(v.score)}分</span></a>
        <div class="vb"><a class="vt" href="${esc(safeUrl(v.url))}" target="_blank" rel="noopener" ${pa}>${esc(v.title)}</a>
          <div class="meta">${esc(v.channel)} · 播放 ${fmtViews(v.views)}${v.published ? " · " + esc(v.published) : ""}</div>
          ${v.reference ? `<div class="ref">${esc(v.reference)}</div>` : ""}
          <div class="pick"><label><input type="checkbox" class="sel" value="${esc(v.url)}"> 选择下载</label>
            <span class="dl">${d ? (d.ok ? `<a href="/runs/${esc(res.run_id)}/${encodeURI(d.file)}" target="_blank">已下载 ${d.size_mb}MB</a>`
                                      : `<span class="err" title="${esc(d.error)}">${d.error && d.error.includes("抖音") ? "抖音需配置 cookies" : "下载失败"}</span>`) : ""}</span></div>
        </div></div>`;
    }
    h += `</div></div>`;
  }
  h += `<div class="card"><h3 style="margin-top:0">参考平台</h3>
    <p class="note" style="margin-top:0">能抓取的平台直接列出作品，点击即在本页播放；需要登录的平台只能打开它的搜索页。</p>`;
  for (const pl of res.platform_links) pl.direct ??= DIRECT.has(pl.name);  // 兼容旧记录
  res.platform_links.forEach((pl, i) => {
    h += `<div class="pfrow"><div class="h"><b>${esc(pl.name)}</b><span class="note">${esc(pl.kind_name)} · ${esc(pl.learn)}</span>
      <a class="note" href="${esc(safeUrl(pl.url))}" target="_blank" rel="noopener">${pl.direct ? "更多结果" : "需登录，打开搜索页"}：${esc(pl.query || "打开")} ↗</a></div>
      ${pl.direct ? `<div class="strip" id="pf${i}"><span class="note">正在抓取…</span></div>` : ""}</div>`;
  });
  h += `</div>`;
  if (res.errors?.length) h += `<div class="card"><b>检索异常</b><ul>${res.errors.map(e => `<li class="note">${esc(e)}</li>`).join("")}</ul></div>`;
  $("#out").innerHTML = h;
  $("#bar").classList.toggle("hidden", s.kept === 0);
  document.querySelectorAll(".sel").forEach(c => c.onchange = updSel);
  updSel();
  res.platform_links.forEach((pl, i) => pl.direct && loadPlatform(pl, $("#pf" + i)));
}

async function loadPlatform(pl, box) {
  try {
    const r = await fetch(`/api/platform_items?name=${encodeURIComponent(pl.name)}&q=${encodeURIComponent(pl.query)}`);
    const j = await r.json();
    if (!j.items?.length) { box.innerHTML = `<span class="note">${esc(j.error || "这次没抓到结果，可点右上“更多结果”去平台搜索")}</span>`; return; }
    box.innerHTML = j.items.map(it => `<a class="it" href="${esc(safeUrl(it.url))}" target="_blank" rel="noopener"
        ${it.media === "image" ? playAttrs(it.url, it.title, it.platform, "", it.thumbnail) : playAttrs(it.url, it.title, it.platform)}>
        <div class="thumb"><img src="${esc(thumbUrl(it.thumbnail, 320))}" loading="lazy" decoding="async" alt="">
          ${it.media === "image" ? "" : `<span class="play">▶</span>`}
          ${it.duration ? `<span class="badge">${fmtDur(it.duration)}</span>` : ""}</div>
        <div class="tt">${esc(it.title)}</div></a>`).join("");
  } catch (e) { box.innerHTML = `<span class="note err">抓取失败</span>`; }
}


function updSel() {
  const n = document.querySelectorAll(".sel:checked").length;
  $("#selcount").textContent = `已选 ${n} 条`; $("#dlbtn").disabled = n === 0;
}
$("#selall").onclick = () => {
  const all = [...document.querySelectorAll(".sel")], on = all.some(c => !c.checked);
  all.forEach(c => c.checked = on); updSel();
};
$("#dlbtn").onclick = () => {
  const urls = [...document.querySelectorAll(".sel:checked")].map(c => c.value);
  submitTask(fetch("/api/download", {method: "POST", headers: {"Content-Type": "application/json"},
                                     body: JSON.stringify({run_id: current.run_id, urls})}), `下载 ${urls.length} 条视频`);
  document.querySelectorAll(".sel:checked").forEach(c => c.checked = false);
  updSel();
};
let DIRECT = new Set();
fetch("/api/direct_platforms").then(r => r.json()).then(a => DIRECT = new Set(a)).catch(() => {});
loadSources();
loadHistory();
refreshTasks();
// 从数据看板跳转过来：/#run=<run_id>
const hashRun = decodeURIComponent((location.hash.match(/^#run=([\w-]+)/) || [])[1] || "");
if (hashRun) viewRun(hashRun);
</script>
</body>
</html>
