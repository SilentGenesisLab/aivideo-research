<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 参考片检索</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  /* 配色：冷灰底 + 一个与图标一致的蓝色强调；不用渐变、光晕和装饰色块 */
  :root { --bg:#f4f5f7; --panel:#ffffff; --ink:#16191f; --muted:#5f6672; --line:#dfe2e7; --field:#fbfbfc;
          --accent:#2457d6; --accent-ink:#ffffff; --focus:rgba(36,87,214,.18); --bad:#b42318; --bad-bg:#fdf1f0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --panel:#181b20; --ink:#e8eaed; --muted:#9aa1ab; --line:#2a2f37; --field:#14171b;
            --accent:#5b86f0; --accent-ink:#0b0d10; --focus:rgba(91,134,240,.25); --bad:#f08b80; --bad-bg:#2a1714; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif; }
  .page { min-height:100%; max-width:1080px; margin:0 auto; padding:48px 32px;
          display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:72px; align-items:center; }
  /* 左侧：品牌与一句话说明 */
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:56px; color:var(--ink); text-decoration:none; }
  .brand img { width:32px; height:32px; border-radius:8px; }
  .brand b { font-size:16px; font-weight:600; }
  .intro h1 { text-wrap:balance; font-size:42px; line-height:1.22; font-weight:650; letter-spacing:-.01em; margin:0 0 18px; max-width:15em; }
  .intro p { margin:0; color:var(--muted); font-size:16px; max-width:30em; }
  .intro ul { list-style:none; padding:0; margin:36px 0 0; display:grid; gap:14px; max-width:34em; }
  .intro li { display:grid; grid-template-columns:20px 1fr; gap:12px; align-items:start; color:var(--ink); }
  .intro li svg { width:20px; height:20px; margin-top:2px; stroke:var(--accent); fill:none; stroke-width:1.7;
                  stroke-linecap:round; stroke-linejoin:round; }
  .intro li span { color:var(--muted); }
  /* 右侧：取景框里的登录表单（取景器四角是本页唯一的装饰） */
  .frame { position:relative; padding:14px; }
  .frame i { position:absolute; width:22px; height:22px; border:0 solid var(--accent); }
  .frame i:nth-child(1) { left:0; top:0; border-left-width:2px; border-top-width:2px; }
  .frame i:nth-child(2) { right:0; top:0; border-right-width:2px; border-top-width:2px; }
  .frame i:nth-child(3) { left:0; bottom:0; border-left-width:2px; border-bottom-width:2px; }
  .frame i:nth-child(4) { right:0; bottom:0; border-right-width:2px; border-bottom-width:2px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:36px 32px 28px; }
  .card h2 { font-size:22px; font-weight:650; margin:0 0 4px; }
  .card .sub { color:var(--muted); margin:0 0 28px; font-size:14px; }
  label.f { display:block; font-size:13px; font-weight:500; margin:0 0 6px; }
  .field { position:relative; margin-bottom:18px; }
  .field input { width:100%; height:44px; padding:0 44px 0 12px; border-radius:8px; border:1px solid var(--line);
                 background:var(--field); color:var(--ink); font:inherit; outline:none; }
  .field input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--focus); background:var(--panel); }
  .eye { position:absolute; right:6px; top:50%; transform:translateY(-50%); width:32px; height:32px; border:0; background:none;
         border-radius:6px; cursor:pointer; color:var(--muted); display:flex; align-items:center; justify-content:center; }
  .eye:hover { color:var(--ink); }
  .eye:focus-visible, .row input:focus-visible, button.go:focus-visible, .links a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .eye svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .row { display:flex; justify-content:space-between; align-items:center; margin:-2px 0 22px; font-size:13px; color:var(--muted); }
  .row label { display:flex; align-items:center; gap:8px; cursor:pointer; }
  .row input { width:16px; height:16px; accent-color:var(--accent); margin:0; }
  #caps { color:var(--bad); }
  button.go { width:100%; height:44px; border:0; border-radius:8px; background:var(--accent); color:var(--accent-ink);
              font:600 15px/1 inherit; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  button.go:hover { filter:brightness(1.06); } button.go:disabled { opacity:.75; cursor:wait; }
  .spin { width:16px; height:16px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%;
          animation:r .8s linear infinite; display:none; } button.go:disabled .spin { display:block; }
  @keyframes r { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation:none; } }
  .err { display:none; background:var(--bad-bg); color:var(--bad); border-radius:8px; padding:10px 12px;
         font-size:13px; margin-bottom:18px; } .err.on { display:block; }
  .links { margin-top:22px; font-size:13px; color:var(--muted); display:flex; gap:20px; }
  .links a { color:var(--muted); } .links a:hover { color:var(--accent); }
  @media (max-width:900px) {
    .page { grid-template-columns:1fr; gap:32px; padding:28px 16px 40px; align-items:start; }
    .brand { margin-bottom:24px; }
    .intro h1 { font-size:28px; margin-bottom:0; }
    .intro p, .intro ul { display:none; }
    .card { padding:28px 20px 22px; }
  }
</style>
</head>
<body>
<div class="page">
  <section class="intro">
    <a class="brand" href="/login"><img src="/favicon.svg" alt=""><b>参考片检索</b></a>
    <h1>上传一张产品图，<br>找到值得参考的广告片</h1>
    <p>AI 识别产品并拆解创意方向，在 16 个视频与广告案例平台中检索、打分，写清每条片子参考什么。</p>
    <ul>
      <li><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <div>识图拆词<br><span>产品画像，以及同品类、竞品、情绪、结构、获奖五个方向</span></div></li>
      <li><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9.5 4 2.5-4 2.5z"/></svg>
        <div>多平台检索<br><span>B 站、抖音、优酷、YouTube、数英、iSpot.tv 等，站内直接播放</span></div></li>
      <li><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <div>视频库与数据看板<br><span>历次结果统一检索，任务和接口调用情况都能查</span></div></li>
    </ul>
  </section>

  <section class="frame" aria-label="登录">
    <i></i><i></i><i></i><i></i>
    <form class="card" id="form" autocomplete="on">
      <h2>登录</h2>
      <p class="sub">使用管理员分配的账号登录</p>
      <div class="err" id="err" role="alert"></div>
      <label class="f" for="u">用户名</label>
      <div class="field">
        <input id="u" name="username" autocomplete="username" required autofocus>
      </div>
      <label class="f" for="p">密码</label>
      <div class="field">
        <input id="p" name="password" type="password" autocomplete="current-password" required>
        <button type="button" class="eye" id="eye" aria-label="显示密码" title="显示或隐藏密码">
          <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="row"><label><input type="checkbox" id="remember" checked> 30 天内保持登录</label><span id="caps"></span></div>
      <button class="go" id="go" type="submit"><span class="spin"></span><span id="gotext">登录</span></button>
      <div class="links"><a href="/developer" target="_blank">接口文档</a><a href="/api/v1/docs" target="_blank">在线调试</a></div>
    </form>
  </section>
</div>
<script>
const $ = s => document.querySelector(s);
const next = (() => {  // 登录后回到原来的页面（只允许站内地址）
  const n = new URLSearchParams(location.search).get("next") || "/";
  const ok = /^\/(?!\/)/.test(n) && !n.startsWith("/login") ? n : "/";
  return ok + (location.hash || "");  // #hash 不会发到服务器，跳转时浏览器保留在登录页地址上，这里带回去
})();
function showErr(msg) { $("#err").textContent = msg; $("#err").classList.add("on"); }
$("#eye").onclick = () => {
  const p = $("#p"); p.type = p.type === "password" ? "text" : "password"; p.focus();
};
$("#p").addEventListener("keyup", e => {
  $("#caps").textContent = e.getModifierState && e.getModifierState("CapsLock") ? "大写锁定已开启" : "";
});
$("#form").onsubmit = async e => {
  e.preventDefault();
  $("#err").classList.remove("on");
  $("#go").disabled = true; $("#gotext").textContent = "登录中…";
  try {
    const r = await fetch("/api/login", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({username: $("#u").value.trim(), password: $("#p").value, remember: $("#remember").checked})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || "暂时无法登录，请稍后重试");
    $("#gotext").textContent = "正在进入…";
    location.replace(next);
  } catch (err) {
    showErr(err.message);
    $("#p").select();
    $("#go").disabled = false; $("#gotext").textContent = "登录";
  }
};
if (new URLSearchParams(location.search).get("expired")) showErr("登录已过期，请重新登录");
</script>
</body>
</html>
